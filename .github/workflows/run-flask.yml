
name: Run Flask App

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  start-flask:
    name: Start Local Flask Website
    runs-on: self-hosted

    steps:
      - name: Start Windows Scheduled Task
        shell: powershell
        run: |
          Write-Host "Starting DevOps Flask application..."

          schtasks.exe /Run /TN "\DevOps-Flask-App"

          if ($LASTEXITCODE -ne 0) {
              throw "Could not start the Windows Scheduled Task."
          }

          $deadline = (Get-Date).AddSeconds(30)
          $listener = $null

          do {
              Start-Sleep -Seconds 2

              $listener = Get-NetTCPConnection `
                  -LocalPort 5000 `
                  -State Listen `
                  -ErrorAction SilentlyContinue

          } while (!$listener -and (Get-Date) -lt $deadline)

          if (!$listener) {
              schtasks.exe /Query /TN "\DevOps-Flask-App" /V /FO LIST
              throw "Flask did not start on port 5000."
          }

          Write-Host "Flask application is running!"
          Write-Host "Local URL: http://127.0.0.1:5000"
