
name: DevOps Lab CI Pipeline

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  automated-tests:
    name: Run Tests and Send Local Report
    runs-on: self-hosted

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Dependencies
        shell: powershell
        run: |
          python -m venv .venv-ci

          $python = Join-Path $PWD ".venv-ci\Scripts\python.exe"

          if (!(Test-Path $python)) {
              Write-Error "Virtual environment Python was not created."
              exit 1
          }

          & $python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          & $python -m pip install -r requirements.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run Tests and Send Report to Local Receiver
        shell: powershell
        run: |
          $python = Join-Path $PWD ".venv-ci\Scripts\python.exe"

          if (!(Test-Path $python)) {
              Write-Error "Virtual environment Python not found."
              exit 1
          }

          & $python run_tests.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Email Test Report
        if: always()
        shell: powershell
        env:
          GMAIL_USERNAME: ${{ secrets.GMAIL_USERNAME }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          $python = Join-Path $PWD ".venv-ci\Scripts\python.exe"

          if (!(Test-Path $python)) {
              Write-Warning "Python environment unavailable. Skipping email."
              exit 0
          }

          if (!(Test-Path "test-report.json")) {
              Write-Warning "Test report not generated. Skipping email."
              exit 0
          }

          if (!$env:GMAIL_USERNAME -or !$env:GMAIL_APP_PASSWORD) {
              Write-Warning "Gmail secrets missing. Skipping email."
              exit 0
          }

          & $python send_email.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  deploy:
    name: Deploy to GitHub Pages
    needs: automated-tests
    if: github.ref == 'refs/heads/main' && needs.automated-tests.result == 'success'
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Website Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs

      - name: Deploy Website
        id: deployment
        uses: actions/deploy-pages@v4
