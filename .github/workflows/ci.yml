
name: DevOps Lab CI Pipeline

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  automated-tests:
    name: Run Tests and Send Local Report
    runs-on: self-hosted

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Dependencies
        shell: powershell
        run: |
          python -m venv .venv-ci
          .\.venv-ci\Scripts\python.exe -m pip install --upgrade pip
          .\.venv-ci\Scripts\python.exe -m pip install -r requirements.txt

      - name: Run Tests and Send Report to Local Receiver
        shell: powershell
        run: |
          .\.venv-ci\Scripts\python.exe run_tests.py
